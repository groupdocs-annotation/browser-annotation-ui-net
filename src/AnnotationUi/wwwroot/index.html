<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Annotation UI</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
<header>
    <h1>Annotation UI</h1>
    <label>
        Document
        <select id="documents"></select>
    </label>
    <span class="pager">
        <button id="prev" type="button" title="Previous page">&#8592;</button>
        <span id="pageLabel">page 1 of 1</span>
        <button id="next" type="button" title="Next page">&#8594;</button>
    </span>
    <span id="status" role="status"></span>
</header>

<main>
    <section class="viewer">
        <div id="stage">
            <img id="page" alt="Document page" />
            <canvas id="overlay"></canvas>
        </div>
        <p class="hint">Drag on the page to mark a region, then type the comment.</p>
    </section>

    <aside class="panel">
        <h2>Annotations</h2>
        <p class="hint" id="empty">Nothing on this page yet.</p>
        <ul id="list"></ul>
    </aside>
</main>

<script src="app.js"></script>
</body>
</html>
